<head>

<!-- =========================================================
     BLOQUE DE SEGURIDAD "SOLO ADMINISTRADOR"
     Versión actualizada: ahora respeta la configuración de
     "Módulos Bloqueados" definida en Gestión de Usuarios.

     Módulo: Directorio de Proveedores
     Clave: proveedores
     ========================================================= -->

<div id="modalSeguridadAdmin" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:999999; display:flex; align-items:center; justify-content:center; font-family:sans-serif;">

  <div style="background:white; padding:24px; border-radius:16px; width:85%; max-width:300px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.5);">

    <div style="font-size:32px; margin-bottom:8px;">
      🔐
    </div>

    <h3 style="margin:0 0 6px 0; font-size:16px; color:#1e293b;">
      Área Exclusiva de Administrador
    </h3>

    <p style="margin:0 0 14px 0; font-size:11px; color:#64748b;">
      Los cajeros no tienen acceso a este menú. Ingresa tu PIN de Administrador.
    </p>

    <input
      type="password"
      id="inputPinAdmin"
      placeholder="••••"
      maxlength="6"
      style="width:100%; padding:12px; font-size:22px; text-align:center; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:12px; box-sizing:border-box; letter-spacing:6px;"
    />

    <button
      onclick="verificarSoloAdmin()"
      style="width:100%; background:#7c3aed; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; font-size:13px; cursor:pointer;">

      Verificar Acceso

    </button>

  </div>

</div>


<script>

var NOMBRE_MODULO_SEGURIDAD = 'proveedores';


function moduloRequierePinAdmin(){

    var datos =
        localStorage.getItem(
            'pos_db_modulos_bloqueados'
        );


    if(!datos){

        return true;

    }


    try{

        var config =
            JSON.parse(datos);


        if(
            !config ||
            typeof config !== 'object' ||
            Array.isArray(config)
        ){

            return true;

        }


        return config[
            NOMBRE_MODULO_SEGURIDAD
        ] !== false;


    }catch(e){

        return true;

    }

}


window.addEventListener(
    'DOMContentLoaded',
    function(){

        const datosUsuarios =
            localStorage.getItem(
                'pos_db_users'
            );


        if(!datosUsuarios){

            document
                .getElementById(
                    'modalSeguridadAdmin'
                )
                .style.display =
                    'none';

            return;

        }


        try{

            const usuarios =
                JSON.parse(
                    datosUsuarios
                );


            const existeAdmin =
                Array.isArray(usuarios) &&
                usuarios.some(
                    u =>
                        u.rol ===
                        'administrador'
                );


            if(
                !existeAdmin ||
                !moduloRequierePinAdmin()
            ){

                document
                    .getElementById(
                        'modalSeguridadAdmin'
                    )
                    .style.display =
                        'none';

            }


        }catch(e){

            document
                .getElementById(
                    'modalSeguridadAdmin'
                )
                .style.display =
                    'none';

        }

    }
);


function verificarSoloAdmin(){

    const pinIngresado =
        document
            .getElementById(
                'inputPinAdmin'
            )
            .value
            .trim();


    const datosUsuarios =
        localStorage.getItem(
            'pos_db_users'
        );


    if(!datosUsuarios){

        document
            .getElementById(
                'modalSeguridadAdmin'
            )
            .style.display =
                'none';

        return;

    }


    const usuarios =
        JSON.parse(
            datosUsuarios
        );


    const existeAdmin =
        usuarios.some(
            u =>
                u.rol ===
                'administrador'
        );


    if(
        !existeAdmin ||
        !moduloRequierePinAdmin()
    ){

        document
            .getElementById(
                'modalSeguridadAdmin'
            )
            .style.display =
                'none';

        return;

    }


    const usuarioValido =
        usuarios.find(
            u =>
                String(u.pin) ===
                String(pinIngresado) &&
                u.rol ===
                'administrador'
        );

    if(usuarioValido){

        document
            .getElementById(
                'modalSeguridadAdmin'
            )
            .style.display =
                'none';

    }else{

        alert(
            "⛔ Acceso denegado. Este menú está restringido únicamente a Administradores."
        );


        document
            .getElementById(
                'inputPinAdmin'
            )
            .value =
                "";

    }

}

</script>

<script>

/* ======================================================
   DATOS
====================================================== */

let proveedores = [];


/* ======================================================
   INICIALIZACIÓN
====================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        cargarProveedores();

        configurarEventos();

        mostrarProveedores();

    }
);


/* ======================================================
   CARGAR DATOS
====================================================== */

function cargarProveedores(){

    try{

        const datos =
            localStorage.getItem(
                "directorioProveedores"
            );


        if(datos){

            const datosParseados =
                JSON.parse(
                    datos
                );


            if(Array.isArray(datosParseados)){

                proveedores =
                    datosParseados;

            }else{

                proveedores = [];

            }

        }else{

            proveedores = [];

        }

    }catch(error){

        console.error(
            "Error al cargar proveedores:",
            error
        );

        proveedores = [];

    }

}


/* ======================================================
   GUARDAR DATOS
====================================================== */

function guardarDatos(){

    localStorage.setItem(
        "directorioProveedores",
        JSON.stringify(
            proveedores
        )
    );

}


/* ======================================================
   CONFIGURAR EVENTOS
====================================================== */

function configurarEventos(){

    const btnNuevo =
        document.getElementById(
            "btnNuevoProveedor"
        );


    if(btnNuevo){

        btnNuevo.addEventListener(
            "click",
            function(){

                abrirNuevoProveedor();

            }
        );

    }


    const btnCancelar =
        document.getElementById(
            "btnCancelarProveedor"
        );


    if(btnCancelar){

        btnCancelar.addEventListener(
            "click",
            function(){

                cerrarModal();

            }
        );

    }


    const condicionesPago =
        document.getElementById(
            "condicionesPago"
        );


    if(condicionesPago){

        condicionesPago.addEventListener(
            "change",
            function(){

                const grupo =
                    document.getElementById(
                        "grupoDiasCredito"
                    );


                if(!grupo){

                    return;

                }


                if(
                    this.value ===
                    "Crédito"
                ){

                    grupo.style.display =
                        "block";

                }else{

                    grupo.style.display =
                        "none";


                    const diasCredito =
                        document.getElementById(
                            "diasCredito"
                        );


                    if(diasCredito){

                        diasCredito.value =
                            "";

                    }

                }

            }
        );

    }


    const busqueda =
        document.getElementById(
            "busqueda"
        );


    if(busqueda){

        busqueda.addEventListener(
            "input",
            function(){

                mostrarProveedores();

            }
        );

    }


    const formProveedor =
        document.getElementById(
            "formProveedor"
        );


    if(formProveedor){

        formProveedor.addEventListener(
            "submit",
            guardarFormulario
        );

    }

}


/* ======================================================
   ABRIR NUEVO PROVEEDOR
====================================================== */

function abrirNuevoProveedor(){

    const formulario =
        document.getElementById(
            "formProveedor"
        );


    const proveedorId =
        document.getElementById(
            "proveedorId"
        );


    const titulo =
        document.getElementById(
            "tituloModal"
        );


    const grupo =
        document.getElementById(
            "grupoDiasCredito"
        );


    const modal =
        document.getElementById(
            "modalProveedor"
        );


    if(!formulario || !modal){

        console.error(
            "No se encontró el formulario o modal de proveedor."
        );

        return;

    }


    formulario.reset();


    if(proveedorId){

        proveedorId.value = "";

    }


    if(titulo){

        titulo.textContent =
            "Nuevo proveedor";

    }


    if(grupo){

        grupo.style.display =
            "none";

    }


    modal.classList.add(
        "show"
    );

}


/* ======================================================
   CERRAR MODAL
====================================================== */

function cerrarModal(){

    const modal =
        document.getElementById(
            "modalProveedor"
        );


    if(modal){

        modal.classList.remove(
            "show"
        );

    }

}


/* ======================================================
   GUARDAR FORMULARIO
====================================================== */

function guardarFormulario(e){

    e.preventDefault();


    const id =
        document
            .getElementById(
                "proveedorId"
            )
            .value;


    const proveedor = {

        id:
            id ||
            Date.now().toString(),

        codigo:
            document
                .getElementById(
                    "codigo"
                )
                .value
                .trim(),

        nombre:
            document
                .getElementById(
                    "nombre"
                )
                .value
                .trim(),

        contacto:
            document
                .getElementById(
                    "contacto"
                )
                .value
                .trim(),

        telefono:
            document
                .getElementById(
                    "telefono"
                )
                .value
                .trim(),

        whatsapp:
            document
                .getElementById(
                    "whatsapp"
                )
                .value
                .trim(),

        correo:
            document
                .getElementById(
                    "correo"
                )
                .value
                .trim(),

        direccion:
            document
                .getElementById(
                    "direccion"
                )
                .value
                .trim(),

        colonia:
            document
                .getElementById(
                    "colonia"
                )
                .value
                .trim(),

        ciudad:
            document
                .getElementById(
                    "ciudad"
                )
                .value
                .trim(),

        estado:
            document
                .getElementById(
                    "estado"
                )
                .value
                .trim(),

        codigoPostal:
            document
                .getElementById(
                    "codigoPostal"
                )
                .value
                .trim(),

        condicionesPago:
            document
                .getElementById(
                    "condicionesPago"
                )
                .value,

        diasCredito:
            document
                .getElementById(
                    "diasCredito"
                )
                .value,

        formaPago:
            document
                .getElementById(
                    "formaPago"
                )
                .value,

        notas:
            document
                .getElementById(
                    "notas"
                )
                .value
                .trim(),

        estadoProveedor:
            document
                .getElementById(
                    "estadoProveedor"
                )
                .value

    };


    /* EDITAR */

    if(id){

        const index =
            proveedores.findIndex(
                p =>
                    p.id ===
                    id
            );


        if(index !== -1){

            proveedores[index] =
                proveedor;

            mostrarMensaje(
                "Proveedor actualizado correctamente"
            );

        }

    }


    /* NUEVO */

    else{

        proveedores.push(
            proveedor
        );

        mostrarMensaje(
            "Proveedor registrado correctamente"
        );

    }


    guardarDatos();

    cerrarModal();

    mostrarProveedores();

}


/* ======================================================
   MOSTRAR PROVEEDORES
====================================================== */

function mostrarProveedores(){

    const contenedor =
        document.getElementById(
            "listaProveedores"
        );


    if(!contenedor){

        return;

    }


    const campoBusqueda =
        document.getElementById(
            "busqueda"
        );


    const busqueda =
        campoBusqueda
        ? campoBusqueda.value
            .toLowerCase()
            .trim()
        : "";


    const filtrados =
        proveedores.filter(
            p => {

                const nombre =
                    String(
                        p.nombre || ""
                    ).toLowerCase();


                const codigo =
                    String(
                        p.codigo || ""
                    ).toLowerCase();


                const telefono =
                    String(
                        p.telefono || ""
                    ).toLowerCase();


                const contacto =
                    String(
                        p.contacto || ""
                    ).toLowerCase();


                return (

                    nombre.includes(
                        busqueda
                    )

                    ||

                    codigo.includes(
                        busqueda
                    )

                    ||

                    telefono.includes(
                        busqueda
                    )

                    ||

                    contacto.includes(
                        busqueda
                    )

                );

            }
        );


    const total =
        document.getElementById(
            "totalProveedores"
        );


    if(total){

        total.textContent =
            proveedores.length;

    }


    const activos =
        document.getElementById(
            "totalActivos"
        );


    if(activos){

        activos.textContent =
            proveedores.filter(
                p =>
                    p.estadoProveedor ===
                    "Activo"
            ).length;

    }


    if(filtrados.length === 0){

        contenedor.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <p>
                    ${
                        busqueda
                        ? "No se encontraron proveedores."
                        : "No hay proveedores registrados."
                    }
                </p>

            </div>

        `;

        return;

    }


    contenedor.innerHTML =
        filtrados
            .map(
                p => `

                <div class="supplier-card">

                    <div class="supplier-top">

                        <div>

                            <div class="supplier-name">

                                ${escaparHTML(
                                    p.nombre
                                )}

                            </div>

                            <div class="supplier-code">

                                Código:
                                ${escaparHTML(
                                    p.codigo
                                )}

                            </div>

                        </div>


                        <span
                            class="status ${
                                p.estadoProveedor ===
                                "Activo"
                                ? "active"
                                : "inactive"
                            }">

                            ${escaparHTML(
                                p.estadoProveedor
                            )}

                        </span>

                    </div>


                    <div class="supplier-info">

                        ${
                            p.contacto
                            ? `

                            <div class="info-row">

                                <span class="info-label">
                                    Contacto:
                                </span>

                                <span class="info-value">

                                    ${escaparHTML(
                                        p.contacto
                                    )}

                                </span>

                            </div>

                            `
                            : ""
                        }


                        ${
                            p.telefono
                            ? `

                            <div class="info-row">

                                <span class="info-label">
                                    Teléfono:
                                </span>

                                <span class="info-value">

                                    ${escaparHTML(
                                        p.telefono
                                    )}

                                </span>

                            </div>

                            `
                            : ""
                        }


                        ${
                            p.correo
                            ? `

                            <div class="info-row">

                                <span class="info-label">
                                    Correo:
                                </span>

                                <span class="info-value">

                                    ${escaparHTML(
                                        p.correo
                                    )}

                                </span>

                            </div>

                            `
                            : ""
                        }


                        <div class="info-row">

                            <span class="info-label">
                                Pago:
                            </span>

                            <span class="info-value">

                                ${escaparHTML(
                                    p.condicionesPago
                                )}

                                ${
                                    p.condicionesPago ===
                                    "Crédito"
                                    ? ` - ${
                                        p.diasCredito || 0
                                    } días`
                                    : ""
                                }

                            </span>

                        </div>


                        ${
                            p.formaPago
                            ? `

                            <div class="info-row">

                                <span class="info-label">
                                    Forma:
                                </span>

                                <span class="info-value">

                                    ${escaparHTML(
                                        p.formaPago
                                    )}

                                </span>

                            </div>

                            `
                            : ""
                        }

                    </div>


                    <div class="card-actions">

                        <button
                            type="button"
                            class="btn btn-edit"
                            data-accion="editar"
                            data-id="${escaparHTML(p.id)}">

                            ✏️ Editar

                        </button>


                        <button
                            type="button"
                            class="btn btn-status"
                            data-accion="estado"
                            data-id="${escaparHTML(p.id)}">

                            ${
                                p.estadoProveedor ===
                                "Activo"
                                ? "Desactivar"
                                : "Activar"
                            }

                        </button>

                    </div>

                </div>

            `
            )
            .join("");


    /* EVENTOS DE TARJETAS */

    contenedor
        .querySelectorAll(
            '[data-accion="editar"]'
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    function(){

                        editarProveedor(
                            this.dataset.id
                        );

                    }
                );

            }
        );


    contenedor
        .querySelectorAll(
            '[data-accion="estado"]'
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    function(){

                        cambiarEstado(
                            this.dataset.id
                        );

                    }
                );

            }
        );

}

        );

/* ======================================================
   CAMBIAR ESTADO
====================================================== */

function cambiarEstado(id){

    const proveedor =
        proveedores.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if(!proveedor){

        return;

    }


    if(
        proveedor.estadoProveedor ===
        "Activo"
    ){

        proveedor.estadoProveedor =
            "Inactivo";

    }else{

        proveedor.estadoProveedor =
            "Activo";

    }


    guardarDatos();

    mostrarProveedores();

    mostrarMensaje(
        "Estado actualizado correctamente"
    );

}


/* ======================================================
   ESCAPAR HTML
====================================================== */

function escaparHTML(texto){

    if(
        texto === null ||
        texto === undefined
    ){

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&"
        )

        .replace(
            /</g,
            "<"
        )

        .replace(
            />/g,
            ">"
        )

        .replace(
            /"/g,
                  
        )

        .replace(
            /'/g,
            "'"
        );

}


/* ======================================================
   MENSAJE
====================================================== */

function mostrarMensaje(mensaje){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        mensaje;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}
